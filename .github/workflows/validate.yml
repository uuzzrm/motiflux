name: Validate Motiflux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project structure and content
        run: python scripts/validate_project.py
      - name: Run offline tool tests
        run: python -m unittest discover -s tests -v
      - name: Run project pipeline smoke test
        run: |
          python skills/motiflux/tools/motiflux.py project examples/basic-mark/mark.svg "AI logo animation" work/ci-project
          python skills/motiflux/tools/motiflux.py validate project work/ci-project/project.json
